name: Seestar

options:
  bundleIdPrefix: fr.thibaut
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SeestarKit:
    path: .
  VLCKitSPM:
    url: https://github.com/virtualox/vlckit-spm
    exactVersion: 4.0.0-alpha.21

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Les Info.plist ne portent plus que ces deux références : les valeurs
    # ci-dessous servent aux compilations locales, et la chaîne de publication
    # les remplace par la version du tag et le nombre de commits. Sans cela,
    # tout envoi repartait avec le build 1 et App Store Connect refusait le
    # second, qui doit toujours porter un numéro plus grand que le précédent.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signature automatique : nécessaire pour installer sur un vrai Apple TV.
    # En simulateur elle est simplement ignorée.
    DEVELOPMENT_TEAM: 46C337T7YN
    CODE_SIGN_STYLE: Automatic

targets:
  SeestarTV:
    type: application
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.thibaut.SeestarCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    sources:
      - Apps/SeestarTV
      - Apps/Shared
    dependencies:
      - package: SeestarKit
        product: SeestarUI
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: Apps/SeestarTV/Info.plist
      properties:
        CFBundleDisplayName: Seestar Companion
        # Les deux numéros viennent des réglages de compilation : la
        # chaîne de publication y met la version du tag et le nombre de
        # commits. Figés ici, tout envoi repartait avec le build 1 et
        # App Store Connect refusait le second, qui doit toujours porter
        # un numéro plus grand que le précédent.
        # L'app ne chiffre rien : tout passe en TCP nu vers le télescope,
        # et le flux vidéo en RTSP sans TLS. Le déclarer ici plutôt que
        # dans App Store Connect évite d'avoir à répondre à la main, envoi
        # après envoi, ce qui bloquerait la publication automatique.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sans cette autorisation, toute connexion au réseau local échoue
        # silencieusement : le télescope semble simplement injoignable.
        NSLocalNetworkUsageDescription: >-
          Seestar Companion connects to your telescope on the local network
          to display its images.
        # Le lever et le coucher du soleil dépendent du lieu. Refuser
        # l'autorisation ne retire que ces deux horaires de la barre.
        NSLocationWhenInUseUsageDescription: >-
          Seestar Companion uses your approximate location to show tonight's
          sunset and sunrise times.

  SeestarViewer:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.thibaut.SeestarCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Apps/SeestarViewer
      - Apps/Shared
    dependencies:
      - package: SeestarKit
        product: SeestarUI
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: Apps/SeestarViewer/Info.plist
      properties:
        CFBundleDisplayName: Seestar Companion
        # Les deux numéros viennent des réglages de compilation : la
        # chaîne de publication y met la version du tag et le nombre de
        # commits. Figés ici, tout envoi repartait avec le build 1 et
        # App Store Connect refusait le second, qui doit toujours porter
        # un numéro plus grand que le précédent.
        # L'app ne chiffre rien : tout passe en TCP nu vers le télescope,
        # et le flux vidéo en RTSP sans TLS. Le déclarer ici plutôt que
        # dans App Store Connect évite d'avoir à répondre à la main, envoi
        # après envoi, ce qui bloquerait la publication automatique.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: >-
          Seestar Companion connects to your telescope on the local network
          to display its images.
        NSLocationWhenInUseUsageDescription: >-
          Seestar Companion uses your approximate location to show tonight's
          sunset and sunrise times.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
