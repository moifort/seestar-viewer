name: Release

# Une seule fiche App Store porte les deux plateformes, donc un seul tag les
# publie ensemble : `git tag v1.0 && git push --tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version affichée (CFBundleShortVersionString), ex. 1.0'
        required: false
        default: '1.0'
      skip_upload:
        description: 'Archiver et exporter, mais ne rien envoyer à App Store Connect'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Barrière : le décodage est vérifié contre l'oracle Python sur une vraie
  # trame. Un binaire qui échoue ici afficherait n'importe quoi sur le
  # téléviseur, autant s'en apercevoir avant de consommer un numéro de build.
  tests:
    name: 🧪 Tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Sélectionner le dernier Xcode définitif
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lancer la suite
        run: swift test

  release:
    name: 📱 ${{ matrix.name }}
    needs: tests
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      # Les deux plateformes partagent l'identifiant fr.thibaut.SeestarCompanion.
      # On les envoie l'une après l'autre : deux téléversements simultanés sur la
      # même app se marchent dessus côté App Store Connect.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: SeestarViewer
            destination: generic/platform=iOS
            altool_type: ios
          - name: tvOS
            scheme: SeestarTV
            destination: generic/platform=tvOS
            altool_type: tvos
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git rev-list --count HEAD doit voir tout l'historique

      - name: Sélectionner le dernier Xcode définitif
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer la clé App Store Connect
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Calculer les numéros de version
        run: |
          set -euo pipefail
          # Le numéro de build doit croître à chaque envoi, sans jamais reculer :
          # le nombre de commits le garantit et ne demande aucun état.
          BUILD=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MARKETING="${GITHUB_REF_NAME#v}"
          else
            MARKETING="${{ github.event.inputs.marketing_version }}"
          fi
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          echo "Publication de Seestar Companion $MARKETING ($BUILD) pour ${{ matrix.name }}"

      - name: Engendrer le projet Xcode
        run: |
          set -euo pipefail
          # Seestar.xcodeproj est gitignoré : il se régénère depuis project.yml.
          brew install xcodegen
          xcodegen generate

      - name: Archiver
        run: |
          set -euo pipefail
          # -allowProvisioningUpdates laisse Xcode créer certificat et profil via
          # la clé API. C'est ce qui dispense de stocker un .p12 en secret. Si
          # l'endpoint de provisionnement répond 401 — il lui arrive d'être
          # capricieux —, il faudra passer à une signature manuelle.
          xcodebuild -project Seestar.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -archivePath "build/${{ matrix.scheme }}.xcarchive" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Exporter un .ipa signé
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "build/${{ matrix.scheme }}.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "build/export-${{ matrix.altool_type }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoyer à App Store Connect
        if: ${{ inputs.skip_upload != true }}
        run: |
          set -euo pipefail
          IPA=$(find "build/export-${{ matrix.altool_type }}" -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::aucun .ipa exporté"; exit 1; }
          xcrun altool --upload-app --type ${{ matrix.altool_type }} \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Permet de récupérer le binaire même quand l'envoi échoue, plutôt que de
      # relancer toute la compilation pour comprendre.
      - name: Conserver le .ipa
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SeestarCompanion-${{ matrix.altool_type }}
          path: build/export-${{ matrix.altool_type }}/*.ipa
          if-no-files-found: ignore
          retention-days: 14
